[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-probability-lab"
version = "0.1.0"
description = "Reproducible football probability modeling research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1,<4.0",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
